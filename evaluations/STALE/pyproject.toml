[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lightmem-stale-eval"
version = "0.1.0"
description = "Reproducible LightMem evaluation harness for the STALE benchmark"
requires-python = ">=3.11,<3.12"
dependencies = [
  "lightmem",
  "boto3>=1.35",
  "openai>=2.3",
  "PyYAML>=6.0",
  "httpx>=0.28",
  "vllm==0.11.0; sys_platform == 'linux'",
]

[project.scripts]
stale-lightmem = "stale_lightmem.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv.sources]
lightmem = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/stale_lightmem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint]
# Broad catches are deliberate at external API/checkpoint boundaries; validation
# consistently reports malformed benchmark data as ValueError.
ignore = ["BLE001", "TRY004"]

